name: Snapshot CFS bundle

# Controls when the action will run.
on:
  workflow_dispatch:
    inputs:
      base-branch:
        description: 'The base branch to merge into (main)'
        type: string
        required: false
        default: ''
      ic-branch:
        description: 'The temporary integration branch to create (ic)'
        type: string
        required: false
        default: ''
      dev-branch:
        description: 'The branch to pull in (dev)'
        type: string
        required: false
        default: ''

permissions:
  issues: write
  contents: write
  pull-requests: write
  actions: write

env:
  BASE_BRANCH: ${{ inputs.base-branch || 'main' }}
  DEV_BRANCH: ${{ inputs.dev-branch || github.event.repository.default_branch }}
  GH_REPO: ${{ github.repository }}
  GH_HOST: github.com
  GH_TOKEN: ${{ secrets.GH_PAT || github.token }}

jobs:
  snapshot-bundle:
    name: Snapshot CFS bundle
    runs-on: ubuntu-latest

    steps:
      - name: Determine IC branch
        env:
          IC_BRANCH_IN: ${{ inputs.ic-branch }}
        run: |
          if [ -z "${IC_BRANCH_IN}" ]
          then
            echo "IC_BRANCH=ic-$(date +%Y%m%d)" >> ${GITHUB_ENV}
          else
            echo "IC_BRANCH=${IC_BRANCH_IN}" >> ${GITHUB_ENV}
          fi

      - name: Checkout bundle
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          submodules: true
          ref: ${{ env.BASE_BRANCH }}
          token: ${{ env.GH_TOKEN }}

      - name: Check initial versions
        run: git submodule

      - name: Fetch base branch in submodules
        run: git submodule foreach 'git fetch origin --no-tags refs/heads/${BASE_BRANCH}:${BASE_BRANCH}'

      - name: Fetch dev branch in submodules
        run: git submodule foreach 'git fetch origin --no-tags refs/heads/${DEV_BRANCH}:${DEV_BRANCH}'

      - name: Create integration branch in submodules
        run: git submodule foreach 'git checkout -b ${IC_BRANCH} ${BASE_BRANCH}'

      - name: Merge dev branch into integration candidate
        run: |
          cat << EOF > ${RUNNER_TEMP}/commit-msg.txt
          Integration Candidate: $(date +%Y-%m-%d) development snapshot

          Automatically generated code snapshot
            - development branch: ${DEV_BRANCH}
            - target branch: ${BASE_BRANCH}
          EOF
          # Most of the time this should be a FF merge, but not
          # doing as FF so we can put a snapshot commit msg on it
          # There must not be conflicts, if there are, then this cannot be done automatically.
          git submodule foreach 'git merge --no-ff -F ${RUNNER_TEMP}/commit-msg.txt'

      - name: Create PRs
        run: |
          git submodule foreach 'GH_REPO=$(git remote get-url origin); GH_REPO=${GH_REPO##*${GH_HOST}[:/]}; echo ${GH_REPO}'

      - name: Stop
        run: /bin/false

