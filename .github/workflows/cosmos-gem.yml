name: Build COSMOS gem

# Run on all pull requests, and pushes in dev and main branches
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

# Force bash to apply pipefail option so pipeline failures aren't masked
defaults:
  run:
    shell: bash

env:
  COSMOS_VERSION: '6.10.5'
  GH_HOST: github.com
  GH_REPO: ${{ github.repository }}

jobs:
  stage-gem:
    strategy:
      fail-fast: false
      matrix:
        config: [ native_std ]

    name: 'Set up ${{ matrix.config }} gem source'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/core-flight-system/cfsbuildenv-linux
    steps:
      - name: Checkout Bundle
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Prepare ${{ matrix.config }} Build
        run: make ${{ matrix.config }}.prep

      - name: Stage gem contents
        run: make ${{ matrix.config }}.gem

      - name: Upload gem contents
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.config }}-gem-content
          path: build-${{ matrix.config }}/cosmos/plugin/*


  build-gem:
    name: 'Build ${{ matrix.config }} gem binary'
    needs: stage-gem
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [ native_std ]

    steps:
      - name: 'Download artifact'
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.config }}-gem-content
          path: ${{ matrix.config }}-gem-content

      ## Note this does not use actions/checkout because this is a public repo
      - name: Check out COSMOS
        uses: actions/checkout@v6
        with:
          repository: 'OpenC3/cosmos-project'
          ref: 'v${{ env.COSMOS_VERSION }}'
          name: ${{ matrix.config }}-gem-content
          path: ${{ matrix.config }}-gem-content

      # This needs to patch relative refs (e.g. "./") with absolute paths to remap them
      - name: Set up COSMOS
        id: setup-cosmos
        run: |
          COSMOS_PROJECT_DIR=$(realpath ./cosmos-project)
          sed -i -e 's/- ".\//- "${COSMOS_PROJECT_DIR}\//' ${COSMOS_PROJECT_DIR}/compose.yaml
          echo project-dir="${COSMOS_PROJECT_DIR}" >> ${GITHUB_OUTPUT}

      - name: Build GEM
        env:
          WORKSPACE_GEM_DIR: ${{ github.workspace }}/${{ matrix.config }}-gem-content
          COSMOS_PROJECT_DIR: ${{ steps.setup-cosmos.outputs.project-dir }}
        run: >
          docker compose -f "${COSMOS_PROJECT_DIR}/compose.yaml" run --rm
          -v ${WORKSPACE_GEM_DIR}:/openc3/local:z
          --user $(id -u):$(id -g) -w /openc3/local -e OPENC3_API_PASSWORD=${OPENC3_API_PASSWORD} --no-deps
          openc3-cosmos-cmd-tlm-api ruby /openc3/bin/openc3cli rake build VERSION=7.0.1

      - name: Upload gem binary
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.config }}-gem-binary
          path: ${{ matrix.config }}-gem-content/*.gem
